<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251f"><title>Albaniy Audio Library</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><button id="backButton" class="back-button" hidden aria-label="Back">‹</button><div class="brand-mark">A</div><div class="brand-copy"><strong>Albaniy Audio Library</strong><small id="pageSubtitle">Recorded lessons</small></div><button id="homeButton" class="icon-button" aria-label="Home">⌂</button></header>
<main><section id="homeView"><div class="intro"><p class="eyebrow">AUDIO COLLECTION</p><h1>Browse lessons</h1><p class="muted">Select a collection to view its recordings.</p></div><div id="categoryGrid" class="category-grid"></div></section>
<section id="categoryView" hidden><div class="section-heading"><p class="eyebrow">COLLECTION</p><h1 id="categoryTitle"></h1><p id="categoryCount" class="muted"></p></div><div class="tools"><label class="search-wrap">⌕ <input id="searchInput" type="search" placeholder="Search recordings"></label><select id="sortSelect" aria-label="Sort"><option value="asc">Oldest first</option><option value="desc">Newest first</option><option value="az">Title A to Z</option></select></div><div id="recordingList" class="recording-list"></div><p id="emptyMessage" class="empty-message" hidden>No recordings match your search.</p></section></main>
<section id="miniPlayer" class="mini-player" hidden><div id="miniArtwork" class="artwork mini-art">A</div><button id="miniTrack" class="mini-track"><strong id="miniTitle">Choose a recording</strong><small id="miniArtist">Late Sheikh Albani Zaria</small></button><button id="miniPlay" class="play-button">▶</button><button id="expandPlayer" class="expand-button">⌃</button></section>
<section id="fullPlayer" class="full-player" hidden><div class="player-top"><button id="minimizePlayer" class="text-button">‹ Back</button><span>NOW PLAYING</span><button id="closePlayer" class="text-button">×</button></div><div id="playerArtwork" class="artwork player-art">A</div><p class="eyebrow">LATE SHEIKH ALBANI ZARIA</p><h2 id="playerTitle">Choose a recording</h2><p id="playerCategory" class="muted"></p><div class="timeline"><input id="seekBar" type="range" min="0" max="1000" value="0"><div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div></div><div class="player-controls"><button id="previousButton" class="round-control">|‹</button><button id="mainPlay" class="main-play">▶</button><button id="nextButton" class="round-control">›|</button></div><div class="player-actions"><button id="favoriteButton" class="action-button">♡ Save favourite</button><button id="recentButton" class="action-button">Recently played</button></div><p id="playerStatus" class="player-status" role="status"></p></section>
<audio id="audioElement" preload="metadata"></audio><script src="app.js"></script></body></html>
